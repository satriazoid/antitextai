[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antitextai"
version = "1.0.0"
description = "Strip AI text and code tells: invisible Unicode, smart quotes, banner separators, end-of-block markers, conversational frames."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Akujejo", email = "satrialfa77@gmail.com" }]
keywords = ["ai", "llm", "text-cleanup", "unicode", "linter", "de-ai", "agent-skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/satriazoid/antitextai"
Repository = "https://github.com/satriazoid/antitextai"
Issues = "https://github.com/satriazoid/antitextai/issues"

[project.scripts]
antitextai = "antitextai.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["antitextai"]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
